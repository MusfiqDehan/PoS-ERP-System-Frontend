# CI/CD Pipeline — gated, sequential
#
# One workflow so deployment is strictly gated on CI passing:
#
#   ci  ->  build-image (GHCR)  ->  deploy (VPS)
#
# - On pull_request: only `ci` runs (validation; no image build, no deploy).
# - On push to main: ci -> build-image -> deploy, in order. If ci fails,
#   build-image and deploy never run.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST     - server IP or hostname
#   VPS_USER     - SSH username
#   VPS_PASSWORD - SSH password
# The VPS must already have Docker installed.

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 1) Quality gate: type-check + unit tests (+ full build on PRs).
  ci:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Clean, reproducible install strictly from package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Fast static type-check; fails on type errors before anything expensive.
      - name: Type-check
        run: npm run typecheck

      # Unit tests (Vitest + React Testing Library).
      - name: Run unit tests
        run: npm run test

      # Full production build as a validation step — only on pull requests.
      # On push to main the build-image job already runs `npm run build` inside
      # Docker, so building here too would just double the work.
      - name: Build application (PR validation)
        if: github.event_name == 'pull_request'
        run: npm run build

  # 2) Build the production image and push it to GHCR. Gated on `ci`.
  build-image:
    name: Build & Push (GHCR)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # GITHUB_TOKEN needs write access to packages to push to GHCR.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the repo name (GHCR requires lowercase) and
      # produces both a :latest and a :sha-<commit> tag.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3) Deploy the freshly published image to the VPS over SSH. Gated on
  #    build-image (and therefore on ci).
  deploy:
    name: Deploy to VPS
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      # Compute the lowercase image reference (GHCR/Docker require lowercase).
      - name: Resolve image name
        id: img
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"

      # SSH in, write a compose file in a fixed app dir, pull and (re)start.
      # Uses password auth (VPS_PASSWORD); swap to key auth later for security.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            APP_DIR=/opt/apps/sortorium-frontend
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Write the compose file (IMAGE expands here from the passed env).
            cat > docker-compose.yml <<COMPOSE
            services:
              frontend:
                image: ${IMAGE}
                container_name: sortorium-frontend
                restart: unless-stopped
                ports:
                  - "3001:3000"
            COMPOSE

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
