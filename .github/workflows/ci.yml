# Continuous Integration (CI)
#
# Validates every change before it reaches the main branch: installs dependencies
# against the committed lockfile and verifies the application builds successfully.
# Required to pass before merging (enforce via branch protection on `main`).

name: CI

# When this pipeline runs:
#   - push to main: validates the integrated branch after a merge
#   - pull_request: validates proposed changes before they are merged
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Install & Build
    runs-on: ubuntu-latest
    steps:
      # Fetch the repository contents at the commit that triggered this run.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pin the Node.js version to match production and enable npm caching
      # so dependency installs are reused across runs for faster pipelines.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Clean, reproducible install strictly from package-lock.json.
      # Fails if the lockfile is out of sync with package.json.
      - name: Install dependencies
        run: npm ci

      # Static type-check (tsc --noEmit). Runs before the build because it is
      # much faster and surfaces type errors without waiting on a full bundle.
      - name: Type-check
        run: npm run typecheck

      # Production build. Catches compilation and bundling errors early.
      - name: Build application
        run: npm run build
