# Continuous Delivery (CD) — Build & Publish Image
#
# Builds the production Docker image (Dockerfile.prod -> Next.js standalone) and
# pushes it to the GitHub Container Registry (GHCR). Runs on GitHub's hosted
# runners (ample RAM), so the production build never depends on a developer's
# local machine. A later job/workflow can pull this image and deploy it to the VPS.

name: Build & Publish Image

# When this pipeline runs:
#   - push to main: publish a fresh image after changes are merged
#   - workflow_dispatch: allow publishing on demand from the Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-image:
    name: Build & Push (GHCR)
    runs-on: ubuntu-latest

    # GITHUB_TOKEN needs write access to packages to push to GHCR.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Enable advanced BuildKit features (multi-stage caching, etc.).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to GHCR using the workflow's built-in token.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive image name + tags. metadata-action lowercases the repo name
      # (GHCR requires lowercase) and produces both a :latest and a :<sha> tag.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      # Build with Dockerfile.prod and push. GitHub Actions cache speeds up
      # repeat builds by reusing unchanged layers.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
