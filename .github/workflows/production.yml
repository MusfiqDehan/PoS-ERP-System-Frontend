name: Production

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
  workflow_dispatch:

env:
  NEXT_PUBLIC_API_BASE_URL: /api/v1
  NEXT_PUBLIC_PUBLIC_API_BASE_URL: https://sortorium.com/api/v1
  NEXT_PUBLIC_PUBLIC_DOMAIN: sortorium.com
  NEXT_PUBLIC_WS_BASE_URL: wss://sortorium.com

jobs:
  ci:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm run test

      - name: Production build
        run: npm run build

  deploy:
    name: Deploy to VPS (blue-green)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Sync code and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=accept-new"
          RSYNC_RSH="ssh ${SSH_OPTS}"

          # Push checkout to VPS over SSH (VPS cannot git-fetch private HTTPS remotes).
          # Do not use git on the server for deploy sync — rsync is the source of truth.
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.deploy-revision' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'out/' \
            --exclude 'coverage/' \
            --exclude '.env.prod' \
            -e "${RSYNC_RSH}" \
            ./ "${VPS_USER}@${VPS_HOST}:${VPS_DEPLOY_PATH}/"

          ssh ${SSH_OPTS} "${VPS_USER}@${VPS_HOST}" \
            "set -euo pipefail
             cd '${VPS_DEPLOY_PATH}'
             chmod +x scripts/deploy/production.sh
             IMAGE_TAG='${IMAGE_TAG}' ./scripts/deploy/production.sh"
