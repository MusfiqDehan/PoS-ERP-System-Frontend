# Live-reload development stack for the Sortonium Next.js front-end.
#
#   docker compose up        -> start the dev server with live reload
#   docker compose up --build-> rebuild the image (after dependency changes)
#   docker compose down      -> stop and remove the container
#
# Edit files locally in your IDE and the changes sync into the container
# instantly via the bind mount + file-watching (polling) below.

services:
  web:
    container_name: sortonium-frontend-dev
    build:
      context: .
      dockerfile: Dockerfile
    # (1) + (2) Bind mount: map the whole local project into /app so local edits
    # are reflected inside the container immediately, with no rebuild/restart.
    # (3) Named volume for node_modules: keeps the container's installed
    # dependencies, prevents the host folder from shadowing them, and survives
    # restarts. The named .next volume persists Webpack's dev cache across
    # `docker compose down/up`, so cold starts get much faster after the first.
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    # (4) Expose + map the Next.js dev port to the host.
    ports:
      - "3000:3000"
    environment:
      # When the project lives on the WSL2 / native Linux filesystem, the bind
      # mount is Linux->Linux, so native inotify events work and polling is NOT
      # needed. Polling is left OFF here to avoid wasted CPU and faster HMR.
      # (If you ever run this from a Windows/OneDrive path again, re-enable:
      #   WATCHPACK_POLLING=1000 and CHOKIDAR_USEPOLLING=true)
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_ENV=development
      # Give the dev compiler more heap so it doesn't garbage-collect-thrash
      # while compiling large routes (2000+ modules).
      - NODE_OPTIONS=--max-old-space-size=4096
    # (5) Start in dev/watch mode (Webpack). NOTE: do NOT use --turbopack here:
    # this project relies on the Webpack/Sass pipeline and Turbopack fails to
    # parse the SCSS. Bound to all interfaces so the host can reach it.
    command: npm run dev -- -H 0.0.0.0 -p 3000
    # Keeps stdin open so you can Ctrl-C cleanly and see colored logs.
    stdin_open: true
    tty: true

volumes:
  node_modules:
  next_cache:
