server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Backend-only paths ───────────────────────────────────────────────────
    # Traefik MUST route /api, /admin, /media, /static to the backend container.
    # If a request reaches this nginx it means Traefik routing is broken.
    # Return 502 (Bad Gateway) so the misconfiguration is immediately obvious
    # instead of a confusing 405 from try_files falling back to index.html.
    location /api/ {
        return 502 '{"detail":"API routing error — request reached frontend nginx. Check Traefik backend router labels."}';
        add_header Content-Type application/json always;
    }
    location /admin/ {
        return 502 '{"detail":"Admin routing error — request reached frontend nginx. Check Traefik backend router labels."}';
        add_header Content-Type application/json always;
    }
    location /media/ {
        return 502 '{"detail":"Media routing error — request reached frontend nginx. Check Traefik backend router labels."}';
        add_header Content-Type application/json always;
    }
    location /static/ {
        return 502 '{"detail":"Static routing error — request reached frontend nginx. Check Traefik backend router labels."}';
        add_header Content-Type application/json always;
    }
    location /ws/ {
        return 502 '{"detail":"WebSocket routing error — request reached frontend nginx. Check Traefik backend router labels."}';
        add_header Content-Type application/json always;
    }
    location /iclock/ {
        return 502 '{"detail":"ADMS routing error — /iclock reached frontend nginx. Check Traefik backend router labels."}';
        add_header Content-Type application/json always;
    }
    location = /cdata {
        return 502 '{"detail":"ADMS routing error — /cdata reached frontend nginx. Check Traefik backend router labels."}';
        add_header Content-Type application/json always;
    }
    location = /getrequest {
        return 502 '{"detail":"ADMS routing error — /getrequest reached frontend nginx. Check Traefik backend router labels."}';
        add_header Content-Type application/json always;
    }
    location = /devicecmd {
        return 502 '{"detail":"ADMS routing error — /devicecmd reached frontend nginx. Check Traefik backend router labels."}';
        add_header Content-Type application/json always;
    }

    # Static export has no server-side rewrites — send / to the sign-in page.
    location = / {
        return 302 /signin;
    }

    # Next.js static export emits route.html files (e.g. signin.html for /signin).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Revalidate exported HTML so deploys do not serve stale shells.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml;
}
